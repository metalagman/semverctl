name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.10.1
        args: --timeout=5m
      env:
        CGO_ENABLED: 0

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    # Seed-only fuzz execution in PR CI. Extended fuzzing runs in nightly workflow.
    - name: Run fuzz seeds
      run: |
        go test ./internal/semverx -run=Fuzz -count=1
        go test ./internal/pathx -run=Fuzz -count=1
        go test ./internal/formats -run=Fuzz -count=1

    # Phase plan: raise this floor to 90%, then 95%.
    - name: Coverage gate (phase 1)
      env:
        COVERAGE_MIN: '85'
      run: ./scripts/coverage_gate.sh coverage.out

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.out
        flags: unittests
        fail_ci_if_error: true
