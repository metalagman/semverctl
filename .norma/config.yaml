profile: default
agents:
  codex_primary:
    type: codex
    model: gpt-5.2-codex
  codex_fast:
    type: codex
    model: gpt-5.1-codex-mini
  gemini_flash:
    type: gemini_aistudio
    model: gemini-3-flash-preview
    api_key: ${GOOGLE_API_KEY}
  claude_primary:
    type: claude
    model: claude-3-opus
  opencode_exec_model:
    type: opencode
    model: opencode/big-pickle

profiles:
  default:
    pdca:
      plan: codex_primary
      do: gemini_flash
      check: codex_primary
      act: codex_primary
    planner: codex_primary
  codex:
    pdca:
      plan: codex_primary
      do: codex_fast
      check: codex_fast
      act: codex_primary
    planner: codex_primary
  claude:
    pdca:
      plan: claude_primary
      do: claude_primary
      check: claude_primary
      act: claude_primary
    planner: claude_primary
  gemini:
    pdca:
      plan: gemini_flash
      do: gemini_flash
      check: gemini_flash
      act: gemini_flash
    planner: gemini_flash
  opencode:
    pdca:
      plan: opencode_exec_model
      do: opencode_exec_model
      check: opencode_exec_model
      act: opencode_exec_model
    planner: opencode_exec_model
budgets:
  max_iterations: 5
retention:
  keep_last: 50
  keep_days: 30
