tool:
  name: semverctl
  main: ./cmd/semverctl/main.go
version:
  source: git-tag
targets:
  - os: darwin
    arch: amd64
  - os: darwin
    arch: arm64
  - os: linux
    arch: amd64
  - os: linux
    arch: arm64
  - os: windows
    arch: amd64
build:
  ldflags: >
    -s -w
    -X github.com/metalagman/semverctl/internal/cli.version=${OMNIDIST_VERSION}
    -X github.com/metalagman/semverctl/internal/cli.gitCommit=${OMNIDIST_GIT_COMMIT}
    -X github.com/metalagman/semverctl/internal/cli.buildDate=${OMNIDIST_BUILD_DATE}
  tags: []
  cgo: false
distributions:
  npm:
    package: '@metalagman/semverctl'
    registry: https://registry.npmjs.org
    access: public
  uv:
    package: semverctl
    index-url: https://upload.pypi.org/legacy/
    linux-tag: manylinux2014
